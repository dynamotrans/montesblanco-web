  <ellipse cx="620" cy="55" rx="20" ry="11" fill="#b3d8f6"/>

  <!-- Parque triangular inferior-izquierda -->
  <path d="M 250 580 L 400 580 L 330 720 Z" fill="#a8d896"/>
  <path d="M 290 595 Q 330 620 360 600 Q 380 620 360 660" fill="none" stroke="#9ec890" stroke-width="2"/>

  <!-- Parque medio-derecha -->
  <rect x="1040" y="320" width="140" height="60" fill="#a8d896" rx="2"/>

  <!-- Parque junto al río (orilla curva) -->
  <path d="M 80 360 Q 200 320 280 360 L 280 410 Q 200 370 80 410 Z" fill="#a8d896" opacity="0.7"/>

  <!-- Parque inferior-derecha con sendero curvo -->
  <path d="M 1020 700 L 1180 700 L 1200 800 L 1020 800 Z" fill="#a8d896"/>
  <path d="M 1030 740 Q 1080 720 1130 750 Q 1170 780 1180 800" fill="none" stroke="#9ec890" stroke-width="3"/>

