       ============================================================= -->
  <!-- Parque del campo de fútbol (arriba-izquierda, va hasta el borde) -->
  <path d="M -20 80 L 240 80 L 250 290 L -20 290 Z" fill="#a8d896"/>
  <!-- Senderito del parque -->
  <path d="M 30 280 Q 80 240 130 250 T 230 230" fill="none" stroke="#9ec890" stroke-width="2"/>

  <!-- Campo de fútbol -->
  <g transform="translate(20,110)">
    <rect width="200" height="140" fill="#9bd09a"/>
    <rect x="8"  y="8"  width="184" height="124" fill="none" stroke="#ffffff" stroke-width="3"/>
    <line x1="100" y1="8" x2="100" y2="132" stroke="#ffffff" stroke-width="3"/>
    <circle cx="100" cy="70" r="20" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="100" cy="70" r="2" fill="#ffffff"/>
    <rect x="8"  y="40" width="26" height="60" fill="none" stroke="#ffffff" stroke-width="3"/>
    <rect x="166" y="40" width="26" height="60" fill="none" stroke="#ffffff" stroke-width="3"/>
    <rect x="8"  y="55" width="10" height="30" fill="none" stroke="#ffffff" stroke-width="3"/>
    <rect x="182" y="55" width="10" height="30" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Parque superior con sendero y estanque -->
  <path d="M 460 -20 L 720 -20 L 720 140 L 460 140 Z" fill="#a8d896"/>
