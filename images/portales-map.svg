    <path d="M -30 380 Q 120 320 240 360 Q 360 400 460 340 Q 540 290 620 320 Q 700 350 760 410 Q 820 470 810 540 Q 800 620 880 660 Q 980 700 1080 660 Q 1140 640 1230 670"
