    <line x1="-20" y1="150" x2="1220" y2="150" stroke="#f7d774" stroke-width="10"/>
    <line x1="-20" y1="220" x2="1220" y2="220" stroke="#f7d774" stroke-width="10"/>
    <line x1="-20" y1="400" x2="1220" y2="400" stroke="#f7d774" stroke-width="10"/>
    <line x1="-20" y1="620" x2="1220" y2="620" stroke="#f7d774" stroke-width="10"/>
    <line x1="-20" y1="780" x2="1220" y2="780" stroke="#f7d774" stroke-width="10"/>
    <line x1="40"  y1="-20" x2="40"  y2="820" stroke="#f7d774" stroke-width="10"/>
    <line x1="140" y1="-20" x2="140" y2="820" stroke="#f7d774" stroke-width="10"/>
    <line x1="360" y1="-20" x2="360" y2="820" stroke="#f7d774" stroke-width="10"/>
    <line x1="540" y1="-20" x2="540" y2="290" stroke="#f7d774" stroke-width="10"/>
    <line x1="680" y1="-20" x2="680" y2="290" stroke="#f7d774" stroke-width="10"/>
    <line x1="540" y1="700" x2="540" y2="820" stroke="#f7d774" stroke-width="10"/>
    <line x1="680" y1="700" x2="680" y2="820" stroke="#f7d774" stroke-width="10"/>
    <line x1="880" y1="-20" x2="880" y2="820" stroke="#f7d774" stroke-width="10"/>
