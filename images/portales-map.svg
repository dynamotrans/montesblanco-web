    <line x1="1000" y1="290" x2="720" y2="430" stroke="#fde293" stroke-width="10"/>
    <line x1="260" y1="700" x2="510" y2="560" stroke="#fde293" stroke-width="10"/>
    <line x1="1000" y1="700" x2="720" y2="560" stroke="#fde293" stroke-width="10"/>

    <!-- Secundarias (amarillo más pálido) -->
