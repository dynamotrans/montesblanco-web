    <!-- Pequeño afluente -->
    <path d="M 900 -20 Q 880 60 850 120 Q 820 180 800 240 Q 780 290 760 330"
          stroke="#5a98d4" stroke-width="20"/>
    <path d="M 900 -20 Q 880 60 850 120 Q 820 180 800 240 Q 780 290 760 330"
          stroke="#b3d8f6" stroke-width="12"/>
  </g>

  <!-- =============================================================
       PLAZA CENTRAL OCTOGONAL (encima de las carreteras)
       ============================================================= -->
  <g>
    <polygon points="580,440 660,440 700,480 700,520 660,560 580,560 540,520 540,480"
             fill="#a8d896" stroke="#fbbc04" stroke-width="6"/>
    <circle cx="620" cy="500" r="14" fill="#9bd09a"/>
  </g>

  <!-- =============================================================
       VÍAS DE TREN (diagonal inferior-izquierda)
       ============================================================= -->
  <g>
    <line x1="200" y1="820" x2="430" y2="540" stroke="#bfbfbf" stroke-width="10"/>
    <line x1="200" y1="820" x2="430" y2="540" stroke="#e0e0e0" stroke-width="4"/>
    <!-- Traviesas -->
    <g stroke="#9c9c9c" stroke-width="2">
      <line x1="206" y1="810" x2="220" y2="800"/>
      <line x1="226" y1="785" x2="240" y2="775"/>
      <line x1="246" y1="760" x2="260" y2="750"/>
      <line x1="266" y1="735" x2="280" y2="725"/>
      <line x1="286" y1="710" x2="300" y2="700"/>
      <line x1="306" y1="685" x2="320" y2="675"/>
      <line x1="326" y1="660" x2="340" y2="650"/>
      <line x1="346" y1="635" x2="360" y2="625"/>
      <line x1="366" y1="610" x2="380" y2="600"/>
      <line x1="386" y1="585" x2="400" y2="575"/>
      <line x1="406" y1="560" x2="420" y2="550"/>
    </g>
  </g>

  <!-- =============================================================
       GLORIETAS / ROTONDAS en cruces clave
       ============================================================= -->
  <g>
    <!-- Mayores (arteria + arteria) -->
    <circle cx="260" cy="290" r="22" fill="#a8d896" stroke="#fbbc04" stroke-width="6"/>
    <circle cx="780" cy="700" r="22" fill="#a8d896" stroke="#fbbc04" stroke-width="6"/>
    <circle cx="440" cy="290" r="20" fill="#a8d896" stroke="#fbbc04" stroke-width="5"/>
    <circle cx="780" cy="290" r="20" fill="#a8d896" stroke="#fbbc04" stroke-width="5"/>
    <circle cx="1000" cy="290" r="20" fill="#a8d896" stroke="#fbbc04" stroke-width="5"/>
    <circle cx="260" cy="700" r="20" fill="#a8d896" stroke="#fbbc04" stroke-width="5"/>
    <circle cx="440" cy="700" r="20" fill="#a8d896" stroke="#fbbc04" stroke-width="5"/>
    <circle cx="1000" cy="700" r="20" fill="#a8d896" stroke="#fbbc04" stroke-width="5"/>
    <circle cx="1000" cy="500" r="20" fill="#a8d896" stroke="#fbbc04" stroke-width="5"/>

    <!-- Secundarias (más pequeñas) -->
    <circle cx="260" cy="500" r="14" fill="#a8d896" stroke="#f7d774" stroke-width="4"/>
  </g>

  <!-- =============================================================
       PUNTOS DORADOS (inmuebles destacados)
       ============================================================= -->
  <g fill="#c8a45c">
    <circle cx="140" cy="350" r="5"/>
    <circle cx="380" cy="450" r="5"/>
    <circle cx="900" cy="350" r="5"/>
    <circle cx="1140" cy="600" r="5"/>
    <circle cx="600" cy="180" r="5"/>
    <circle cx="850" cy="450" r="5"/>
  </g>
</svg>
