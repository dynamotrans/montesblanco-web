    <line x1="-20" y1="500" x2="510" y2="500" stroke="#fbbc04" stroke-width="22"/>
    <line x1="710" y1="500" x2="1220" y2="500" stroke="#fbbc04" stroke-width="22"/>
    <line x1="-20" y1="700" x2="1220" y2="700" stroke="#fbbc04" stroke-width="22"/>
    <line x1="260" y1="-20" x2="260" y2="820" stroke="#fbbc04" stroke-width="22"/>
    <line x1="440" y1="-20" x2="440" y2="280" stroke="#fbbc04" stroke-width="22"/>
    <line x1="440" y1="710" x2="440" y2="820" stroke="#fbbc04" stroke-width="22"/>
    <line x1="780" y1="-20" x2="780" y2="280" stroke="#fbbc04" stroke-width="22"/>
    <line x1="780" y1="710" x2="780" y2="820" stroke="#fbbc04" stroke-width="22"/>
    <line x1="1000" y1="-20" x2="1000" y2="820" stroke="#fbbc04" stroke-width="22"/>

